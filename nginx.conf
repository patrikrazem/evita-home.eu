server {
    listen 80;
    server_name evita-home.eu www.evita-home.eu;
    return 301 https://evita-home.eu$request_uri;
}

server {
    listen 443 ssl;
    server_name www.evita-home.eu;

    ssl_certificate     /etc/letsencrypt/live/evita-home.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evita-home.eu/privkey.pem;

    return 301 https://evita-home.eu$request_uri;
}

server {
    listen 443 ssl;
    server_name evita-home.eu;

    ssl_certificate     /etc/letsencrypt/live/evita-home.eu/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/evita-home.eu/privkey.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /opt/evita-home.eu;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location /media/ {
        expires 30d;
        add_header Cache-Control "public";
    }
}
